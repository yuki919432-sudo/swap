name: Integration

# Real Supabase integration tests. Boots a DISPOSABLE local Supabase stack on the
# GitHub runner (`supabase start`), applies all migrations from a clean state, and
# runs the integration suites against the real PostgREST API, Auth, and Storage
# services (and the storage/private schemas). No production project, no production
# secrets — the CLI mints throwaway local keys. The fast pgTAP tests (in ci.yml)
# remain the unit-level check; these are the additional round-trip proofs:
#   * storage.integration.mjs    — Storage authorization (11 requirements)
#   * membership.integration.mjs — membership RPCs over the PostgREST boundary
#   * otp.integration.mjs        — Email OTP request/verify over PostgREST

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure Supabase CLI is available (resilient fallback)
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase --version
            exit 0
          fi
          echo "::warning::supabase CLI not on PATH after setup-cli; falling back to the npx wrapper"
          npx --yes supabase --version
          # Expose a `supabase` shim that delegates to the npx wrapper.
          printf '#!/usr/bin/env bash\nexec npx --yes supabase "$@"\n' | sudo tee /usr/local/bin/supabase >/dev/null
          sudo chmod +x /usr/local/bin/supabase
          supabase --version

      - name: Start disposable Supabase stack + apply migrations
        run: |
          set -euo pipefail
          # Exclude services this test does not need, to keep startup lean.
          supabase start -x studio,imgproxy,inbucket,realtime,edge-runtime,logflare,vector
          # Apply every migration from a clean state.
          supabase db reset --no-seed

      - name: Run integration suites (Storage, membership, OTP)
        run: |
          set -euo pipefail
          supabase status -o json > /tmp/status.json
          export SUPABASE_URL="$(node -e "process.stdout.write(require('/tmp/status.json').API_URL)")"
          export SUPABASE_ANON_KEY="$(node -e "process.stdout.write(require('/tmp/status.json').ANON_KEY)")"
          export SUPABASE_SERVICE_ROLE_KEY="$(node -e "process.stdout.write(require('/tmp/status.json').SERVICE_ROLE_KEY)")"
          node supabase/tests/integration/storage.integration.mjs
          node supabase/tests/integration/membership.integration.mjs
          node supabase/tests/integration/otp.integration.mjs

      - name: Dump logs on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          for c in $(docker ps -aq); do
            echo "===== logs: $c ====="
            docker logs "$c" 2>&1 | tail -60 || true
          done

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup || true
