name: Pages

# Publishes the static legal/support site in ./site to GitHub Pages so the app has
# public, reachable Privacy Policy / Terms / Community Guidelines / Support URLs
# (required by App Review). Enable once in the repo: Settings → Pages → Build and
# deployment → Source: "GitHub Actions".
on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
